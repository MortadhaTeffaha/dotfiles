command_timeout = 2000

format = '$kubernetes${custom.git_worktree}$directory$git_branch$all'

[custom.git_worktree]
when = 'git rev-parse --git-dir 2>/dev/null | grep -q "worktrees"'
command = 'echo "🌳"'
format = '[$output]($style) '
style = 'bold yellow'

[git_status]
format = '([\[$modified$untracked$ahead_behind\]]($style) )'
style = 'red bold'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[golang]
disabled = true

[helm]
disabled = true

[lua]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[swift]
disabled = true

